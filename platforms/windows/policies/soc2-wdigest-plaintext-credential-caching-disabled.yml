- name: '[SOC 2] Windows - WDigest plaintext credential caching disabled'
  query: |
    SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential' AND data = '0';
  critical: false
  description: SOC 2 CC6.1. Stops LSASS from keeping plaintext passwords in memory. (CIS 4.4.5)
  resolution: Set HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential to 0.
  platform: windows
