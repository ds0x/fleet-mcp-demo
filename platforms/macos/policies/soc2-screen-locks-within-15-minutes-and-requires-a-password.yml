- name: '[SOC 2] macOS - Screen locks within 15 minutes and requires a password'
  query: |
    SELECT 1 WHERE
      EXISTS (SELECT 1 FROM managed_policies WHERE domain='com.apple.screensaver' AND name='askForPassword' AND (value='1' OR value='true'))
      AND EXISTS (SELECT 1 FROM managed_policies WHERE domain='com.apple.screensaver' AND name='idleTime' AND CAST(value AS INTEGER) BETWEEN 1 AND 900);
  critical: false
  description: SOC 2 CC6.1. Prevents unauthorized use of an unattended, logged-in Mac. Checks the MDM-managed screensaver settings.
  resolution: Deploy a com.apple.screensaver profile with askForPassword = true, askForPasswordDelay = 0 and idleTime of 900 seconds or less.
  platform: darwin
