- name: '[SOC 2] macOS - Automatic security updates enabled'
  query: |
    SELECT 1 FROM managed_policies WHERE domain='com.apple.SoftwareUpdate' AND name='CriticalUpdateInstall' AND (value='1' OR value='true') LIMIT 1;
  critical: false
  description: SOC 2 CC7.1, CC8.1. Ensures critical security responses and system data files install automatically.
  resolution: Deploy a com.apple.SoftwareUpdate profile with CriticalUpdateInstall = true and AutomaticallyInstallMacOSUpdates = true.
  platform: darwin
