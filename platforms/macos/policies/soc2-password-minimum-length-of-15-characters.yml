- name: '[SOC 2] macOS - Password minimum length of 15 characters'
  query: |
    SELECT 1
    FROM (
      SELECT cast(lengthtxt as integer(2)) minlength
      FROM (
        SELECT SUBSTRING(length, 1, 2) AS lengthtxt
        FROM (
          SELECT policy_description, policy_identifier, split(policy_content, '{', 1) AS length
          FROM password_policy
          WHERE policy_identifier LIKE '%minLength'))
      WHERE minlength >= 15);
  critical: false
  description: SOC 2 CC6.1. Enforces strong local account passwords. (CIS 5.2.2) Lower the threshold here if your written password policy specifies a shorter minimum.
  resolution: Deploy a com.apple.mobiledevice.passwordpolicy profile with minLength of 15 or more.
  platform: darwin
